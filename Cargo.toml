[workspace]
members = [
    "apps/fabric-broker",
    "apps/fabric-cli",
    "apps/fabric-demo",
    "apps/fabric-desktop/relay",
    "apps/fabric-mcp-bridge",
    "crates/fabric-broker-core",
    "crates/fabric-broker-policy",
    "crates/fabric-core",
    "crates/fabric-desktop-contracts",
    "crates/fabric-google-calendar",
    "crates/fabric-google-fake",
    "crates/fabric-policy",
    "crates/fabric-storage",
    "crates/fabric-token",
    "crates/fabric-wire",
]
# The Tauri host builds only on macOS and needs Node, so it is its own Cargo workspace
# (scripts/verify-desktop.sh and scripts/build-desktop.sh build it).
exclude = ["apps/fabric-desktop/src-tauri"]
default-members = ["apps/fabric-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

