name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  posix:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-26
          - ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: sh scripts/setup.sh
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: sh scripts/verify-contracts.sh --typecheck

  windows:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - shell: pwsh
        run: ./scripts/setup.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - shell: pwsh
        working-directory: contracts/desktop/v1/typescript
        run: node --test
