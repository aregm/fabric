<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fabric Calendar</title>
<link rel="stylesheet" href="styles.css">
<script type="module" src="main.js"></script>
</head>
<body>
<header>
  <h1>Fabric Calendar</h1>
  <p id="build-line" class="note">Development build.</p>
  <nav aria-label="Screens">
    <ul class="nav">
      <li><a id="nav-review" href="#review">Review agent actions</a></li>
      <li><a id="nav-permissions" href="#permissions">Agent permissions</a></li>
      <li><a id="nav-contacts" href="#contacts">Contacts</a></li>
      <li><a id="nav-preferences" href="#preferences">Calendar preferences</a></li>
      <li><a id="nav-status" href="#status">Status</a></li>
    </ul>
  </nav>
</header>
<div id="attention" class="attention" role="region" aria-label="Needs your attention" hidden>
  <ul id="attention-list" class="list"></ul>
</div>
<main>
  <section id="review" class="screen" aria-labelledby="review-heading">
    <h2 id="review-heading" tabindex="-1">Review agent actions</h2>
  </section>
  <section id="permissions" class="screen" aria-labelledby="permissions-heading" hidden>
    <h2 id="permissions-heading" tabindex="-1">Agent permissions</h2>
  </section>
  <section id="contacts" class="screen" aria-labelledby="contacts-heading" hidden>
    <h2 id="contacts-heading" tabindex="-1">Contacts</h2>
  </section>
  <section id="preferences" class="screen" aria-labelledby="preferences-heading" hidden>
    <h2 id="preferences-heading" tabindex="-1">Calendar preferences</h2>
  </section>
  <section id="status" class="screen" aria-labelledby="status-heading" hidden>
    <h2 id="status-heading" tabindex="-1">Status</h2>
  </section>
</main>
<div id="announcer" role="status" aria-live="polite" class="visually-hidden"></div>
</body>
</html>
