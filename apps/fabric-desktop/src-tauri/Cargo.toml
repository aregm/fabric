# The Tauri host of Fabric Calendar. It is its own Cargo workspace: Tauri builds only where its
# platform libraries are, and the root workspace must stay checkable on Linux and Windows. The
# host's logic that needs no Tauri is the workspace crate `fabric-desktop-relay`, which every
# runner tests. scripts/verify-desktop.sh and scripts/build-desktop.sh build this crate.
[package]
name = "fabric-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false , features = [] }

[dependencies]
fabric-desktop-contracts = { path = "../../../crates/fabric-desktop-contracts" }
fabric-desktop-relay = { path = "../relay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the webview runtime. The default features also bring asset compression and a way to
# change capabilities at run time, which the shell does not need.
tauri = { version = "=2.12.5", default-features = false, features = ["wry"] }

# The same lints as the root workspace.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
