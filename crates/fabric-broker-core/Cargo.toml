[package]
name = "fabric-broker-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fabric-desktop-contracts = { path = "../fabric-desktop-contracts" }
fabric-storage = { path = "../fabric-storage" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# A second connection to the store, for fault injection in the acceptance tests.
[target.'cfg(target_os = "macos")'.dev-dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled"] }

[lints]
workspace = true
